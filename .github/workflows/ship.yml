name: Ship (TestFlight)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notification notes'
        required: false
        type: string

concurrency:
  group: ship
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight
    if: ${{ github.repository == 'Innei/lody-ios' }}
    uses: ./.github/workflows/release.yml
    with:
      notes: ${{ inputs.notes }}
    secrets: inherit
